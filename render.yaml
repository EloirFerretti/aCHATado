services:
  - type: web
    name: achatado
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_URL
        value: https://achatado.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: TWITCH_EVENTSUB_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: achatado-db
          property: connectionString
