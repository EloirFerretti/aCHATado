name: Verify Kick badges in browser

on:
  push:
    branches:
      - verify-kick-badges-browser

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify browser-side Kick transport
        run: |
          cat > verify-kick-browser.mjs <<'EOF'
          import { chromium } from "playwright";

          const SITE = "https://achatado.onrender.com/chat";
          const TARGET_COMMIT = "bbf94a7cc6ae55d9174ef3beb3231675983bf9be";
          const PUSHER_KEY = "32cbd69e4b950bf97679";
          const PUSHER_URL =
            `wss://ws-us2.pusher.com/app/${PUSHER_KEY}?protocol=7&client=js&version=8.4.0&flash=false`;

          async function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          for (let i = 0; i < 36; i++) {
            try {
              const response = await fetch("https://achatado.onrender.com/api/health", {
                headers: { Accept: "application/json" },
              });
              const json = await response.json();
              if (json?.version === TARGET_COMMIT || json?.version === "unknown") break;
            } catch {}
            await sleep(5000);
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 800 },
          });
          const page = await context.newPage();
          page.on("console", (msg) => console.log("[browser]", msg.type(), msg.text()));

          await page.goto(SITE, { waitUntil: "domcontentloaded", timeout: 90000 });

          const result = await page.evaluate(async ({ pusherUrl }) => {
            const channelAttempts = [];
            let channel = null;

            for (const version of ["v1", "v2"]) {
              const url = `https://kick.com/api/${version}/channels/xqc`;
              try {
                const response = await fetch(url, {
                  cache: "no-store",
                  credentials: "omit",
                });
                const text = await response.text();
                let json = null;
                try { json = JSON.parse(text); } catch {}
                channelAttempts.push({
                  version,
                  status: response.status,
                  ok: response.ok,
                  corsReadable: true,
                  chatroomId: json?.chatroom?.id ?? null,
                });
                if (response.ok && json?.chatroom?.id) {
                  channel = json;
                  break;
                }
              } catch (error) {
                channelAttempts.push({
                  version,
                  status: null,
                  ok: false,
                  corsReadable: false,
                  error: String(error),
                });
              }
            }

            if (!channel?.chatroom?.id) {
              return { channelAttempts, error: "chatroom_resolution_failed" };
            }

            const chatroomId = String(channel.chatroom.id);

            let history = null;
            try {
              const response = await fetch(
                `https://kick.com/api/v2/channels/${encodeURIComponent(chatroomId)}/messages`,
                { cache: "no-store", credentials: "omit" },
              );
              const text = await response.text();
              let json = null;
              try { json = JSON.parse(text); } catch {}
              const messages = Array.isArray(json?.data?.messages)
                ? json.data.messages
                : Array.isArray(json?.messages)
                  ? json.messages
                  : [];
              const badgeV2Messages = messages.filter(
                (message) =>
                  Array.isArray(message?.sender?.identity?.badges_v2) &&
                  message.sender.identity.badges_v2.length > 0,
              );
              const levelMessages = messages.filter((message) =>
                (message?.sender?.identity?.badges_v2 || []).some(
                  (badge) =>
                    badge?.name === "level" &&
                    Number.isFinite(Number(badge?.metadata?.level)),
                ),
              );
              history = {
                status: response.status,
                ok: response.ok,
                count: messages.length,
                badgeV2Messages: badgeV2Messages.length,
                levelMessages: levelMessages.length,
                sampleLevel:
                  levelMessages
                    .flatMap((message) => message.sender.identity.badges_v2)
                    .find((badge) => badge?.name === "level")?.metadata?.level ?? null,
              };
            } catch (error) {
              history = { error: String(error) };
            }

            const websocket = await new Promise((resolve) => {
              const ws = new WebSocket(pusherUrl);
              let subscribed = false;
              let messages = 0;
              let badgeV2Messages = 0;
              let levelMessages = 0;
              let sampleLevel = null;

              const finish = () => {
                try { ws.close(); } catch {}
                resolve({
                  connected: true,
                  subscribed,
                  messages,
                  badgeV2Messages,
                  levelMessages,
                  sampleLevel,
                });
              };

              const timeout = setTimeout(finish, 25000);

              ws.onmessage = (event) => {
                let frame;
                try { frame = JSON.parse(event.data); } catch { return; }

                if (frame.event === "pusher:connection_established") {
                  ws.send(JSON.stringify({
                    event: "pusher:subscribe",
                    data: { auth: "", channel: `chatrooms.${chatroomId}.v2` },
                  }));
                  return;
                }

                if (frame.event === "pusher_internal:subscription_succeeded") {
                  subscribed = true;
                  return;
                }

                if (frame.event === "pusher:ping") {
                  ws.send(JSON.stringify({ event: "pusher:pong", data: {} }));
                  return;
                }

                if (
                  frame.event !== "App\\Events\\ChatMessageEvent" &&
                  frame.event !== "App\\Events\\ChatMessageSentEvent"
                ) return;

                let data;
                try {
                  data =
                    typeof frame.data === "string"
                      ? JSON.parse(frame.data)
                      : frame.data;
                } catch {
                  return;
                }

                messages += 1;
                const badges = Array.isArray(data?.sender?.identity?.badges_v2)
                  ? data.sender.identity.badges_v2
                  : [];
                if (badges.length) badgeV2Messages += 1;
                const level = badges.find(
                  (badge) =>
                    badge?.name === "level" &&
                    Number.isFinite(Number(badge?.metadata?.level)),
                );
                if (level) {
                  levelMessages += 1;
                  sampleLevel = Number(level.metadata.level);
                  clearTimeout(timeout);
                  finish();
                }
              };

              ws.onerror = () => {
                clearTimeout(timeout);
                resolve({ connected: false, subscribed, error: "websocket_error" });
              };
            });

            return {
              channelAttempts,
              chatroomId,
              history,
              websocket,
            };
          }, { pusherUrl: PUSHER_URL });

          console.log("KICK_BROWSER_RESULT=" + JSON.stringify(result, null, 2));

          if (!result.chatroomId) {
            throw new Error("Browser could not resolve Kick chatroom ID");
          }
          if (!result.websocket?.subscribed) {
            throw new Error("Browser could not subscribe to Kick Pusher chatroom");
          }

          await browser.close();
          EOF
          node verify-kick-browser.mjs
