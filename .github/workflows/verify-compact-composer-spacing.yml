name: Verify compact composer spacing

on:
  push:
    branches:
      - verify-compact-composer-spacing

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          npm install
          npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify compact emote spacing
        run: |
          cat > verify-spacing.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();

          await page.route("**/api/auth/status", async (route) => {
            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({
                twitch: { connected: false, configured: true },
                kick: { connected: true, configured: true, userName: "Kick test" },
                youtube: { connected: false, configured: true },
              }),
            });
          });

          await page.goto("https://achatado.onrender.com/chat", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });

          await page.evaluate(async () => {
            const response = await fetch("/api/channels/resolve", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                channels: { twitch: "", kick: "xqc", youtube: "" },
              }),
            });
            const json = await response.json();
            if (!response.ok || !json?.channels?.kick?.channelId) {
              throw new Error("Kick channel resolution failed: " + JSON.stringify(json));
            }
            localStorage.setItem(
              "achatado_channel_inputs",
              JSON.stringify({ twitch: "", kick: "xqc", youtube: "" }),
            );
            localStorage.setItem("achatado_channels", JSON.stringify(json.channels));
          });

          let result = null;
          for (let attempt = 1; attempt <= 30; attempt++) {
            await page.reload({ waitUntil: "domcontentloaded", timeout: 90000 });

            const kickButton = page.locator(".platformSwitch button.kick");
            if (!(await kickButton.count())) {
              await page.waitForTimeout(5000);
              continue;
            }

            await kickButton.click();
            const pickerButton = page.locator(".emotePickerButton");
            if (!(await pickerButton.count())) {
              await page.waitForTimeout(5000);
              continue;
            }

            await pickerButton.click();
            await page.waitForTimeout(2500);

            const native = page
              .locator(".emotePickerItem")
              .filter({ has: page.locator('img[src*="files.kick.com/emotes/"]') })
              .first();

            if (!(await native.count())) {
              await page.waitForTimeout(5000);
              continue;
            }

            const picked = await native.evaluate((button) => {
              const img = button.querySelector("img");
              return {
                code: img?.getAttribute("alt") || "",
                src: img?.getAttribute("src") || "",
              };
            });
            if (!picked.code) continue;

            await native.click();
            const textarea = page.locator(".textWrap textarea");
            await textarea.fill(`${picked.code} texto`);
            await page.waitForTimeout(300);

            result = await page.evaluate((code) => {
              const mirror = document.querySelector(".composerRichMirror");
              const emote = mirror?.querySelector(".composerRichEmote");
              const image = emote?.querySelector("img");
              const textNodes = mirror
                ? [...mirror.childNodes].filter(
                    (node) => node.nodeType === Node.ELEMENT_NODE || node.nodeType === Node.TEXT_NODE,
                  )
                : [];

              let textRect = null;
              for (const node of textNodes) {
                if (node.nodeType === Node.ELEMENT_NODE) {
                  if (node.classList?.contains("composerRichEmote")) continue;
                  const text = node.textContent || "";
                  if (text.includes("texto")) {
                    const range = document.createRange();
                    const child = node.firstChild;
                    if (child) {
                      const start = Math.max(0, text.indexOf("texto"));
                      range.setStart(child, start);
                      range.setEnd(child, start + 5);
                      const rect = range.getBoundingClientRect();
                      textRect = { left: rect.left, right: rect.right };
                    }
                  }
                }
              }

              const emoteRect = emote?.getBoundingClientRect();
              const imageRect = image?.getBoundingClientRect();
              const textareaEl = document.querySelector(".textWrap textarea");
              const style = textareaEl ? getComputedStyle(textareaEl) : null;

              return {
                code,
                mirrorText: mirror?.textContent || "",
                emoteWidth: emoteRect?.width || 0,
                imageWidth: imageRect?.width || 0,
                textLeft: textRect?.left || 0,
                emoteRight: emoteRect?.right || 0,
                gap: textRect && emoteRect ? textRect.left - emoteRect.right : null,
                spellcheck: textareaEl?.getAttribute("spellcheck"),
                textFill: style?.getPropertyValue("-webkit-text-fill-color") || "",
              };
            }, picked.code);

            console.log("ATTEMPT=" + attempt + " " + JSON.stringify(result));

            if (
              result?.emoteWidth > 0 &&
              result?.emoteWidth <= 34 &&
              result?.gap !== null &&
              result.gap <= 10 &&
              !result.mirrorText.includes(picked.code)
            ) break;

            await page.waitForTimeout(5000);
          }

          console.log("SPACING_RESULT=" + JSON.stringify(result, null, 2));

          if (!result) throw new Error("No spacing result");
          if (result.emoteWidth > 34) {
            throw new Error("Composer emote still reserves shortcut-width space");
          }
          if (result.gap === null || result.gap > 10) {
            throw new Error("Gap after composer emote is still too large");
          }
          if (result.mirrorText.includes(result.code)) {
            throw new Error("Shortcut text is still visible in rich mirror");
          }

          await browser.close();
          EOF

          node verify-spacing.mjs
