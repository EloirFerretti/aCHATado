name: Generate official Kick level badge SVGs

on:
  push:
    branches:
      - kick-level-badge-scrape

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download current Kick badge bundle
        run: |
          mkdir -p kick-level-inspection/bundles
          curl --fail --location --retry 3 \
            'https://assets.kick.com/main/_next/static/chunks/0_45ph9i3l3di.js' \
            -o kick-level-inspection/bundles/kick-badges.js

      - name: Generate and validate Level1-Level99
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          source = Path("kick-level-inspection/bundles/kick-badges.js").read_text(encoding="utf-8")
          pattern = re.compile(
              r"""\{name:"Level(\d+)",viewBox:"([^"]+)",body:'((?:\\.|[^'])*)',category:"brand-unique",owner:"kick"\}"""
          )
          matches = pattern.findall(source)

          target = Path("public/badges/kick")
          target.mkdir(parents=True, exist_ok=True)
          levels = []

          for level, view_box, body in matches:
              number = int(level)
              if not 1 <= number <= 99:
                  continue

              body = body.replace("\\'", "'").replace("\\\\", "\\")
              svg = (
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="{view_box}">'
                  f'<title>Level {number}</title>{body}</svg>\n'
              )
              ET.fromstring(svg)
              (target / f"level-{number}.svg").write_text(svg, encoding="utf-8")
              levels.append(number)

          levels = sorted(set(levels))
          expected = list(range(1, 100))
          assert levels == expected, f"incomplete catalog: expected 1-99, got {levels}"
          print(f"validated {len(levels)} official Kick level SVGs: {levels[0]}-{levels[-1]}")
          PY

      - name: Commit SVG catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/badges/kick/level-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Add official Kick level badge SVGs"
            git push
          fi
