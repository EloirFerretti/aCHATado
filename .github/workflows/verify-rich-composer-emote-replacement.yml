name: Verify rich composer emote replacement

on:
  push:
    branches:
      - verify-rich-composer-emote-replacement

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          npm install
          npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify emote replaces shortcut visually
        run: |
          cat > verify-rich-composer.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
          });
          const page = await context.newPage();

          await page.route("**/api/auth/status", async (route) => {
            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({
                twitch: { connected: false, configured: true },
                kick: { connected: true, configured: true, userName: "Kick test" },
                youtube: { connected: false, configured: true },
              }),
            });
          });

          await page.goto("https://achatado.onrender.com/chat", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });

          const resolved = await page.evaluate(async () => {
            const response = await fetch("/api/channels/resolve", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                channels: { twitch: "", kick: "xqc", youtube: "" },
              }),
            });
            const json = await response.json();
            if (!response.ok || !json?.channels?.kick?.channelId) {
              throw new Error("Kick channel resolution failed: " + JSON.stringify(json));
            }
            localStorage.setItem(
              "achatado_channel_inputs",
              JSON.stringify({ twitch: "", kick: "xqc", youtube: "" }),
            );
            localStorage.setItem(
              "achatado_channels",
              JSON.stringify(json.channels),
            );
            return json.channels.kick;
          });
          console.log("RESOLVED=" + JSON.stringify(resolved));

          let result = null;

          for (let attempt = 1; attempt <= 30; attempt++) {
            await page.reload({ waitUntil: "domcontentloaded", timeout: 90000 });

            const kickButton = page.locator(".platformSwitch button.kick");
            if (await kickButton.count()) {
              await kickButton.click();

              const pickerButton = page.locator(".emotePickerButton");
              if (await pickerButton.count()) {
                await pickerButton.click();
                await page.waitForTimeout(2500);

                const native = page
                  .locator(".emotePickerItem")
                  .filter({
                    has: page.locator('img[src*="files.kick.com/emotes/"]'),
                  })
                  .first();

                if (await native.count()) {
                  const picked = await native.evaluate((button) => {
                    const img = button.querySelector("img");
                    return {
                      code: img?.getAttribute("alt") || "",
                      src: img?.getAttribute("src") || "",
                    };
                  });

                  if (!picked.code) continue;

                  await native.click();
                  await page.waitForTimeout(300);

                  const selected = await page.evaluate((code) => {
                    const textarea = document.querySelector(".textWrap textarea");
                    const mirror = document.querySelector(".composerRichMirror");
                    const image = mirror?.querySelector("img");
                    const style = textarea ? getComputedStyle(textarea) : null;
                    return {
                      code,
                      textareaValue: textarea?.value || "",
                      textareaColor: style?.color || "",
                      webkitTextFillColor:
                        style?.getPropertyValue("-webkit-text-fill-color") || "",
                      mirrorText: mirror?.textContent || "",
                      imageSrc: image?.getAttribute("src") || "",
                      imageCount: mirror?.querySelectorAll("img").length || 0,
                    };
                  }, picked.code);

                  const textarea = page.locator(".textWrap textarea");
                  await textarea.fill(`teste ${picked.code} fim`);
                  await page.waitForTimeout(300);

                  const typed = await page.evaluate((code) => {
                    const mirror = document.querySelector(".composerRichMirror");
                    return {
                      code,
                      mirrorText: mirror?.textContent || "",
                      imageCount: mirror?.querySelectorAll("img").length || 0,
                    };
                  }, picked.code);

                  result = { picked, selected, typed };
                  console.log("ATTEMPT=" + attempt + " " + JSON.stringify(result));

                  if (
                    selected.imageCount > 0 &&
                    !selected.mirrorText.includes(picked.code) &&
                    typed.imageCount > 0 &&
                    !typed.mirrorText.includes(picked.code) &&
                    typed.mirrorText.includes("teste") &&
                    typed.mirrorText.includes("fim")
                  ) {
                    break;
                  }
                }
              }
            }

            await page.waitForTimeout(5000);
          }

          console.log("RICH_COMPOSER_RESULT=" + JSON.stringify(result, null, 2));

          if (!result?.selected?.textareaValue?.includes(result?.picked?.code || "")) {
            throw new Error("Underlying plain-text shortcut was not preserved");
          }
          if (!result?.selected?.imageCount) {
            throw new Error("Selected emote image was not rendered in the composer mirror");
          }
          if (result.selected.mirrorText.includes(result.picked.code)) {
            throw new Error("Selected shortcut text is still visible in the rich composer mirror");
          }
          if (!result.selected.imageSrc.includes("files.kick.com/emotes/")) {
            throw new Error("Composer mirror did not render the native Kick emote image");
          }
          if (!result?.typed?.imageCount) {
            throw new Error("Typed emote shortcut did not render an image");
          }
          if (result.typed.mirrorText.includes(result.picked.code)) {
            throw new Error("Typed shortcut text is still visible in the rich composer mirror");
          }

          await browser.close();
          EOF

          node verify-rich-composer.mjs
