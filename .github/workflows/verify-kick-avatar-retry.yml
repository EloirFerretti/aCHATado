name: Verify Kick avatar retry

on:
  push:
    branches:
      - verify-kick-avatar-retry

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          npm install
          npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify late avatar appears without refresh
        run: |
          cat > verify-avatar-retry.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1400, height: 900 } });
          const page = await context.newPage();

          let profileCalls = 0;
          const avatar = "https://files.kick.com/images/user/7404530/profile_image/conversion/104a9b9a-3882-49b1-aa55-22eae3dab24f-medium.webp";

          await page.route("**/api/auth/status", async (route) => {
            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({
                twitch: { connected: false, configured: true },
                kick: { connected: true, configured: true, userName: "Kick test" },
                youtube: { connected: false, configured: true },
              }),
            });
          });

          await page.route("**/api/messages**", async (route) => {
            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({
                dbConfigured: true,
                dbProvider: "test",
                messages: [{
                  id: 1,
                  platform: "kick",
                  platform_message_id: "late-avatar-1",
                  channel_id: "123",
                  author_id: "7404530",
                  author_name: "Fossabot",
                  author_avatar: null,
                  author_color: "#53fc18",
                  message: "teste",
                  created_at: new Date().toISOString(),
                  raw: { sender: { id: 7404530, username: "Fossabot", slug: "fossabot", identity: { badges: [], badges_v2: [] } } }
                }]
              }),
            });
          });

          await page.route("https://kick.com/api/v2/channels/xqc/users/fossabot", async (route) => {
            profileCalls++;
            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({
                id: 7404530,
                username: "Fossabot",
                slug: "fossabot",
                profile_pic: profileCalls >= 2 ? avatar : null,
              }),
            });
          });

          await page.route("https://kick.com/api/v1/users/fossabot", async (route) => {
            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({ id: 7404530, username: "Fossabot", profilepic: null }),
            });
          });

          await page.route("https://kick.com/api/v2/channels/fossabot", async (route) => {
            await route.fulfill({
              status: 404,
              contentType: "application/json",
              body: JSON.stringify({}),
            });
          });

          await page.goto("https://achatado.onrender.com/chat", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });

          await page.evaluate(() => {
            localStorage.setItem(
              "achatado_channels",
              JSON.stringify({
                kick: {
                  platform: "kick",
                  input: "xqc",
                  channelId: "123",
                  channelName: "xqc",
                  live: true,
                },
              }),
            );
            localStorage.setItem(
              "achatado_channel_inputs",
              JSON.stringify({ twitch: "", kick: "xqc", youtube: "" }),
            );
          });

          await page.reload({ waitUntil: "domcontentloaded", timeout: 90000 });

          await page.waitForFunction(
            () => document.querySelectorAll(".avatarRing.kick").length > 0,
            null,
            { timeout: 15000 },
          );

          const before = await page.evaluate(() => ({
            imageCount: document.querySelectorAll(".avatarRing.kick img").length,
            fallback: document.querySelector(".avatarRing.kick .avatarFallback")?.textContent?.trim() || "",
          }));

          await page.waitForFunction(
            () => document.querySelectorAll(".avatarRing.kick img").length > 0,
            null,
            { timeout: 10000 },
          );

          const after = await page.evaluate(() => ({
            imageCount: document.querySelectorAll(".avatarRing.kick img").length,
            src: document.querySelector(".avatarRing.kick img")?.getAttribute("src") || "",
          }));

          console.log("AVATAR_RETRY_RESULT=" + JSON.stringify({ before, after, profileCalls }, null, 2));

          if (profileCalls < 2) throw new Error("Avatar lookup was not retried");
          if (!after.imageCount || !after.src.includes("files.kick.com")) {
            throw new Error("Late Kick avatar did not appear without refresh");
          }

          await browser.close();
          EOF

          node verify-avatar-retry.mjs
